name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # Lints each package as `pnpm pack` produces it, so a broken `exports` map
      # or a missing file fails here instead of in a consumer's install.
      - run: pnpm run pack:check

  # The commands these workflows run are exercised by the CLI's gitops-example test;
  # this checks the workflow files themselves, which actionlint skips by default
  # since they sit outside this repository's own .github/workflows.
  example-workflows:
    name: lint the gitops example workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color examples/gitops/.github/workflows/flags.yml examples/gitops/.github/workflows/flags-rollback.yml
