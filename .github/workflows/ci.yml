name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # Lints each package as `pnpm pack` produces it, so a broken `exports` map
      # or a missing file fails here instead of in a consumer's install.
      - run: pnpm run pack:check

  bench:
    name: benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Shared runners are too noisy for a threshold, so a slow or failed run
    # never blocks a PR; the numbers are posted for a reviewer to read.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An explicit `shell: bash` adds pipefail, so a failing bench is not hidden by `tee`.
      - run: pnpm run bench --ui=stream 2>&1 | tee bench.log
        shell: bash

      - run: node scripts/bench-comment.mjs bench.log > bench-comment.md

      # A fork's token cannot write comments, so its PRs get the job log only.
      - name: Post or update the sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- kurenwimpel-bench -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@bench-comment.md
          else
            gh pr comment "$PR" --repo "$REPO" --body-file bench-comment.md
          fi
