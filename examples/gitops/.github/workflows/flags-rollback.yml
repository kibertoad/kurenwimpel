name: Flags rollback

# Points an environment back at a stored revision without touching the
# repository, from a job bound to that GitHub environment so its credentials and
# reviewers apply. Revert the commit on main afterwards, or the next merge that
# touches the environment publishes it again.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to roll back.
        type: environment
        required: true
      to:
        description: A revision or a unique prefix of one. Empty goes back to the revision before the current one.
        type: string
        required: false
      config:
        description: The kurenwimpel config, relative to the repository root.
        type: string
        default: flags/kurenwimpel.config.json
      cli-version:
        description: The @kurenwimpel/cli version to install.
        type: string
        default: latest

permissions: {}

jobs:
  rollback:
    name: roll back ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    concurrency:
      group: flags-publish-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CONFIG: ${{ inputs.config }}
      TO: ${{ inputs.to }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-kurenwimpel
        with:
          version: ${{ inputs.cli-version }}

      - name: Roll back
        run: |
          to=()
          if [ -n "$TO" ]; then to=(--to "$TO"); fi
          kurenwimpel rollback "$ENVIRONMENT" --config "$CONFIG" "${to[@]}"
          kurenwimpel revisions "$ENVIRONMENT" --config "$CONFIG"
