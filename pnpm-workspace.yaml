packages:
  - 'packages/*'

# Keep a single copy of the toolchain across every workspace package.
linkWorkspacePackages: deep
saveWorkspaceProtocol: rolling
dedupePeerDependents: true

# pnpm blocks lifecycle scripts unless a dependency is allowed here.
# Both of these download a prebuilt platform binary on install.
allowBuilds:
  esbuild: true
  workerd: true

# pnpm holds back freshly published versions by default. The zod adapter was
# released after this package needed it, so it is exempted by exact version —
# a new release still waits out the delay.
minimumReleaseAgeExclude:
  - '@toad-contracts/zod@0.2.0'
